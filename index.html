<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1228">
<title>OTP Verification UI</title>
<style>
:root{
  --bg:#0b1228;
  --panel:#101a35;
  --blue:#3b82f6;
  --purple:#8b5cf6;
  --text:#f8fafc;
  --muted:#94a3b8;
}
*{box-sizing:border-box}
body{
  min-height:100vh;
  margin:0;
  display:grid;
  place-items:center;
  padding:28px 16px;
  overflow-x:hidden;
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse at 8% 12%,rgba(37,99,235,.9) 0,rgba(37,99,235,.24) 23%,transparent 48%),
    radial-gradient(ellipse at 93% 88%,rgba(139,92,246,.82) 0,rgba(139,92,246,.22) 24%,transparent 49%),
    linear-gradient(135deg,#080e20,#0b1228 55%,#090d1c);
}
.page{width:min(100%,440px)}
.page-title{
  margin:0 0 28px;
  text-align:center;
  color:#93c5fd;
  font-size:clamp(22px,4vw,30px);
  font-weight:800;
  letter-spacing:-.5px;
  text-shadow:0 0 16px rgba(96,165,250,.45);
}
.otp-box{
  position:relative;
  isolation:isolate;
  padding:36px 30px 30px;
  border:1px solid rgba(96,165,250,.52);
  border-radius:16px;
  background:rgba(12,20,43,.92);
  box-shadow:
    0 0 0 4px rgba(96,165,250,.15),
    0 0 25px rgba(96,165,250,.45),
    inset 0 2px 6px rgba(255,255,255,.08);
  text-align:center;
}
.otp-box::after{
  content:'';
  position:absolute;
  inset:-6px;
  border-radius:22px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  opacity:0;
  filter:blur(12px);
  transition:.3s;
  z-index:-1;
}
.otp-box:focus-within::after{opacity:.35}
.lock-icon{
  width:62px;height:62px;margin:0 auto 16px;
  display:grid;place-items:center;
  border-radius:17px;
  background:linear-gradient(135deg,#3b5cf6,#7c3aed);
  box-shadow:0 8px 25px rgba(99,102,241,.35);
  font-size:29px;
}
h2{margin:0 0 9px;font-size:23px;font-weight:750;letter-spacing:-.3px}
.subtitle{margin:0 auto 28px;max-width:330px;color:var(--muted);font-size:13px;line-height:1.6}
.otp-inputs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin:0 0 27px}
.otp-inputs input{
  width:100%;min-width:0;height:62px;
  border:1px solid rgba(148,163,184,.19);
  border-radius:13px;
  outline:none;
  background:rgba(30,41,59,.7);
  color:#f8fafc;
  text-align:center;
  font:700 23px/1 Inter,system-ui,sans-serif;
  caret-color:#93c5fd;
  transition:all .22s ease;
}
.otp-inputs input:focus{
  transform:translateY(-6px) scale(1.05);
  border-color:#6ba3fa;
  background:rgba(59,130,246,.12);
  box-shadow:
    0 0 0 4px rgba(96,165,250,.15),
    0 0 25px rgba(96,165,250,.45),
    inset 0 2px 6px rgba(255,255,255,.08);
}
.otp-inputs input.filled{border-color:rgba(96,165,250,.38)}
.verify-btn{
  width:100%;height:49px;border:0;border-radius:12px;
  color:white;font-size:14px;font-weight:750;
  background:linear-gradient(100deg,#2563eb,#6d28d9);
  box-shadow:0 8px 22px rgba(59,130,246,.25);
  cursor:pointer;transition:transform .2s,filter .2s,box-shadow .2s;
}
.verify-btn:hover{transform:translateY(-2px);filter:brightness(1.12);box-shadow:0 11px 28px rgba(99,102,241,.38)}
.verify-btn:active{transform:translateY(0)}
.verify-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.countdown{display:flex;justify-content:center;align-items:center;gap:7px;margin:20px 0 25px;color:#aab7cb;font-size:13px}
.timer-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 9px #22c55e}
.timer-dot.expired{background:#f59e0b;box-shadow:0 0 9px #f59e0b}
.resend-line{margin:0;color:#94a3b8;font-size:13px}
.resend{
  border:0;padding:0;background:none;color:#60a5fa;
  font:700 13px inherit;cursor:pointer;
}
.resend:disabled{color:#64748b;cursor:not-allowed}
.message{
  display:none;align-items:center;gap:10px;
  margin:0 0 19px;padding:11px 12px;border-radius:11px;
  text-align:left;font-size:11px;line-height:1.45;
  animation:messageIn .25s ease both;
}
.message.show{display:flex}
.message.error{background:rgba(127,29,29,.3);border:1px solid rgba(248,113,113,.25);color:#fecaca}
.message.success{background:rgba(6,78,59,.32);border:1px solid rgba(74,222,128,.25);color:#bbf7d0}
.message-icon{flex:none;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800}
.error .message-icon{background:#ef4444;color:white}
.success .message-icon{background:#16a34a;color:white}
@keyframes messageIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.otp-box.verified{border-color:rgba(74,222,128,.65);box-shadow:0 0 25px rgba(34,197,94,.18)}
.otp-box.verified .lock-icon{background:linear-gradient(135deg,#059669,#22c55e)}
.demo-note{margin:17px 0 0;text-align:center;color:#64748b;font-size:10px}
@media(max-width:420px){
  .otp-box{padding:30px 18px 25px}
  .otp-inputs{gap:6px}
  .otp-inputs input{height:54px;font-size:20px;border-radius:10px}
  .subtitle{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="page">
  <h1 class="page-title">OTP Verification UI</h1>
  <section class="otp-box" id="otpBox" aria-labelledby="heading">
    <div class="lock-icon" id="lockIcon" aria-hidden="true">🔒</div>
    <h2 id="heading">OTP Verification</h2>
    <p class="subtitle">Enter the 6-digit verification code sent to your mobile number</p>

    <form id="otpForm" novalidate>
      <div class="otp-inputs" id="otpInputs" aria-label="Six digit verification code">
        <input inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="1" aria-label="OTP digit 1" autofocus>
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="OTP digit 2">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="OTP digit 3">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="OTP digit 4">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="OTP digit 5">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="OTP digit 6">
      </div>

      <div class="message" id="message" role="status" aria-live="polite">
        <span class="message-icon" id="messageIcon"></span>
        <span id="messageText"></span>
      </div>

      <button class="verify-btn" id="verifyBtn" type="submit">Verify OTP</button>
    </form>

    <div class="countdown">
      <span class="timer-dot" id="timerDot"></span>
      <span id="timerText">Code expires in 00:59</span>
    </div>
    <p class="resend-line">Didn't receive the code? <button class="resend" id="resendBtn" type="button" disabled>Resend OTP</button></p>
  </section>
  <p class="demo-note">Demo mode · Test OTP: <strong>123456</strong></p>
</main>
<script>
(() => {
  const inputs = [...document.querySelectorAll('#otpInputs input')];
  const form = document.getElementById('otpForm');
  const box = document.getElementById('otpBox');
  const message = document.getElementById('message');
  const messageIcon = document.getElementById('messageIcon');
  const messageText = document.getElementById('messageText');
  const verifyBtn = document.getElementById('verifyBtn');
  const timerText = document.getElementById('timerText');
  const timerDot = document.getElementById('timerDot');
  const resendBtn = document.getElementById('resendBtn');
  const DEMO_OTP = '123456';
  let seconds = 59;
  let timerId = null;
  let verified = false;

  const getCode = () => inputs.map(input => input.value).join('');
  const clearMessage = () => {
    message.className = 'message';
    messageText.textContent = '';
    messageIcon.textContent = '';
  };
  const showMessage = (type, title, detail) => {
    message.className = `message show ${type}`;
    messageIcon.textContent = type === 'success' ? '✓' : '×';
    messageText.innerHTML = `<strong>${title}</strong><br>${detail}`;
  };
  const updateInputs = () => inputs.forEach(input => input.classList.toggle('filled', !!input.value));
  const updateTimer = () => {
    timerText.textContent = `Code expires in 00:${String(seconds).padStart(2,'0')}`;
    timerDot.classList.toggle('expired', seconds === 0);
  };
  const startTimer = () => {
    clearInterval(timerId);
    seconds = 59;
    resendBtn.disabled = true;
    updateTimer();
    timerId = setInterval(() => {
      if (seconds > 0) seconds--;
      updateTimer();
      if (seconds === 0) {
        clearInterval(timerId);
        resendBtn.disabled = false;
        timerText.textContent = 'Code expired';
      }
    }, 1000);
  };

  inputs.forEach((input, index) => {
    input.addEventListener('input', () => {
      const digit = input.value.replace(/\D/g, '').slice(-1);
      input.value = digit;
      clearMessage();
      updateInputs();
      if (digit && index < inputs.length - 1) inputs[index + 1].focus();
      if (verified) resetVerified();
    });
    input.addEventListener('keydown', event => {
      if (event.key === 'Backspace' && !input.value && index > 0) {
        inputs[index - 1].focus();
      } else if (event.key === 'ArrowLeft' && index > 0) {
        inputs[index - 1].focus();
      } else if (event.key === 'ArrowRight' && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    });
    input.addEventListener('paste', event => {
      const pasted = (event.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
      if (!pasted) return;
      event.preventDefault();
      pasted.split('').forEach((digit, i) => { inputs[i].value = digit; });
      updateInputs();
      inputs[Math.min(pasted.length, 5)].focus();
      clearMessage();
    });
  });

  function resetVerified() {
    verified = false;
    box.classList.remove('verified');
    verifyBtn.disabled = false;
    verifyBtn.textContent = 'Verify OTP';
  }

  form.addEventListener('submit', event => {
    event.preventDefault();
    if (verified) return;
    const code = getCode();
    if (code.length !== 6) {
      showMessage('error', 'Incomplete OTP', 'Please enter all 6 digits of the verification code.');
      inputs.find(input => !input.value)?.focus();
      return;
    }
    if (code !== DEMO_OTP) {
      showMessage('error', 'Invalid OTP', 'Please enter the correct 6-digit OTP.');
      inputs[5].focus();
      inputs[5].select();
      return;
    }
    verified = true;
    box.classList.add('verified');
    showMessage('success', 'OTP Verified Successfully', 'Your account has been verified.');
    verifyBtn.textContent = 'Verified';
    verifyBtn.disabled = true;
    clearInterval(timerId);
  });

  resendBtn.addEventListener('click', () => {
    inputs.forEach(input => input.value = '');
    updateInputs();
    clearMessage();
    resetVerified();
    startTimer();
    inputs[0].focus();
  });

  startTimer();
  inputs[0].focus();
})();
</script>
</body>
</html>
